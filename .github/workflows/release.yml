name: Release

# This fork tracks upstream main and publishes binaries for platforms
# upstream doesn't cover. Two jobs:
#
#   sync      -> snapshot upstream main, overlay our release files
#   release   -> build+publish, only for upstream releases we lack
#
# No container images are built; see .goreleaser.yaml, which has no
# dockers_v2 section.
#
# GITHUB_TOKEN cannot create or update workflow files, and upstream
# often touches .github/workflows. Rebasing those commits onto this
# fork is therefore impossible without a PAT. Instead, sync writes
# one fast-forward commit: upstream's tree plus this fork's
# .github/workflows and .goreleaser.yaml. Those paths do not change
# in the push, so the default token is enough.
on:
  # Any push to main (including sync's own snapshot) re-evaluates
  # both jobs; the bot push itself skips sync to avoid a loop.
  push:
    branches: [main]
  # Public repos have scheduled workflows auto-disabled after 60 days
  # without repository activity; any push revives them.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: >-
          Upstream release to build (e.g. v0.3.0). Leave empty to build
          every unbuilt upstream release, oldest first.
        required: false

permissions:
  contents: write

jobs:
  # Keep main as: upstream's tree + this fork's release files.
  # Fast-forward only; never force-push.
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: add upstream remote
        run: git remote add upstream https://github.com/tailscale/tailcat

      - name: fetch upstream
        run: git fetch upstream main

      - name: overlay fork files onto upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git read-tree upstream/main
          git rm -r --cached --ignore-unmatch --force .github/workflows >/dev/null
          # HEAD is still this fork's main: read-tree only swapped the
          # index. Restore our workflow files and GoReleaser config so
          # the pushed tree does not create or update them.
          git restore --source=HEAD --staged -- .github/workflows .goreleaser.yaml
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "Already synced to upstream $(git rev-parse --short upstream/main)."
            exit 0
          fi

          msg="sync: tailscale/tailcat $(git rev-parse --short upstream/main)"
          commit=$(git commit-tree "$tree" -p HEAD -m "$msg")
          git push origin "$commit":refs/heads/main

  # Build and publish upstream releases this fork doesn't have yet.
  # Gated on upstream's releases, not on upstream's commits: upstream
  # merges to main far more often than it cuts a release, and only
  # releases should produce artifacts here.
  release:
    needs: sync
    # Skip if sync failed (a failed overlay leaves main stale, and
    # building that tree would ship the wrong code).
    if: needs.sync.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          install-only: true

      - name: find unbuilt upstream releases
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ github.event.inputs.upstream_tag }}
        run: |
          set -euo pipefail
          have=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                   --json tagName --jq '.[].tagName')
          all=$(gh release list --repo tailscale/tailcat --limit 200 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')
          if [ -n "${WANTED:-}" ]; then
            if ! echo "$all" | grep -Fxq "$WANTED"; then
              echo "::error::upstream has no final release $WANTED"
              exit 1
            fi
            all="$WANTED"
          fi
          # comm needs sorted input; -13 keeps upstream-only tags.
          # Unsorted upstream order, so emit oldest-listed last.
          pending=$(comm -13 <(echo "$have" | sort) <(echo "$all" | sort))
          if [ -z "$pending" ]; then
            echo "tags=" >> "$GITHUB_OUTPUT"
            echo "No new upstream releases to build."
            exit 0
          fi
          echo "Unbuilt upstream releases: $(echo "$pending" | tr '\n' ' ')"
          {
            echo "tags<<TAGS_EOF"
            echo "$pending"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: build each pending release
        if: steps.pending.outputs.tags != ''
        env:
          # gh reads GH_TOKEN; goreleaser reads GITHUB_TOKEN and fails
          # outright without it ("missing GITHUB_TOKEN, GITLAB_TOKEN
          # and GITEA_TOKEN"), so both are needed here.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "=== building upstream $tag ==="
            # Resolve the tagged commit, then fetch it. A shallow
            # fetch keeps the run fast; the build needs no history.
            sha=$(gh api "repos/tailscale/tailcat/commits/$tag" --jq '.sha')
            git fetch --depth 1 https://github.com/tailscale/tailcat "$sha"
            git checkout --force "$sha"
            # Overlay this fork's release config on upstream's release
            # code. "origin" here is wherever actions/checkout pointed,
            # and the fork's config lives on its own main, so fetch it
            # explicitly rather than assuming a local branch exists.
            git fetch --depth 1 origin main
            git checkout FETCH_HEAD -- .goreleaser.yaml

            # A detached checkout has no tag history for the changelog,
            # and GoReleaser's would come out empty, so write notes.
            {
              echo "Mirrored build of upstream [$tag](https://github.com/tailscale/tailcat/releases/tag/$tag)."
              echo
              echo "Built from upstream commit \`$sha\` with this fork's"
              echo "[\`.goreleaser.yaml\`](https://github.com/$GITHUB_REPOSITORY/blob/main/.goreleaser.yaml),"
              echo "which adds release targets upstream does not publish"
              echo "(macOS, FreeBSD, OpenBSD, Linux riscv64). The Linux"
              echo "and Windows binaries match upstream's; the rest are"
              echo "additions, not re-builds."
              echo
              echo "See the [upstream release](https://github.com/tailscale/tailcat/releases/tag/$tag)"
              echo "for the changelog."
            } > /tmp/notes.md

            # GORELEASER_CURRENT_TAG makes GoReleaser treat the tree as
            # upstream's tag, so artifact names and the embedded
            # --version match upstream instead of a snapshot hash.
            GORELEASER_CURRENT_TAG="$tag" \
              goreleaser release --clean --skip=validate \
                --release-notes=/tmp/notes.md
          done <<< "${{ steps.pending.outputs.tags }}"
