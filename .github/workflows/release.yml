name: Release

# Two paths, picked apart by github.event_name below:
#
#   push of a v* tag  -> build whatever tree the tag points at
#   schedule / manual -> mirror upstream releases missing here
#
# This fork exists only to publish binaries for platforms upstream
# doesn't cover, so no container images are built (see .goreleaser.yaml,
# which has no dockers_v2 section).
on:
  push:
    tags: ["v*"]
  # Public repos have scheduled workflows auto-disabled after 60 days
  # without repository activity; any push revives them.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: >-
          Upstream release to mirror (e.g. v0.3.0). Leave empty to
          mirror every unmirrored upstream release, oldest first.
        required: false

permissions:
  contents: write

jobs:
  # Mirror upstream releases this fork doesn't have yet.
  #
  # Scheduled runs always execute the default branch, so this checks
  # out main to pick up the current .goreleaser.yaml, then re-points
  # the worktree at the exact commit upstream tagged. Releases can lag
  # upstream main, so building main would ship code that no upstream
  # release ever contained.
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same pinned version as the goreleaser job below. install-only
      # because the mirror step loops over releases and needs the
      # binary on PATH, not a single action invocation.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          install-only: true
      - name: find unmirrored upstream releases
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ github.event.inputs.upstream_tag }}
        run: |
          set -euo pipefail
          have=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                   --json tagName --jq '.[].tagName')
          all=$(gh release list --repo tailscale/tailcat --limit 200 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')
          if [ -n "${WANTED:-}" ]; then
            if ! echo "$all" | grep -Fxq "$WANTED"; then
              echo "::error::upstream has no final release $WANTED"
              exit 1
            fi
            all="$WANTED"
          fi
          # comm wants sorted input; -13 keeps upstream-only tags.
          pending=$(comm -13 <(echo "$have" | sort) <(echo "$all" | sort))
          if [ -z "$pending" ]; then
            echo "tags=" >> "$GITHUB_OUTPUT"
            echo "Nothing to mirror; up to date with upstream."
            exit 0
          fi
          echo "Unmirrored upstream releases: $(echo "$pending" | tr '\n' ' ')"
          {
            echo "tags<<TAGS_EOF"
            echo "$pending"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: mirror each pending release
        if: steps.pending.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "=== mirroring upstream $tag ==="
            sha=$(gh api "repos/tailscale/tailcat/commits/$tag" --jq '.sha')
            git fetch --depth 1 https://github.com/tailscale/tailcat "$sha"
            git checkout --force "$sha"
            # Overlay this fork's release config; everything else in
            # the tree is upstream's release code.
            git checkout main -- .goreleaser.yaml

            # A shallow detached checkout has no tag history, so
            # GoReleaser's changelog comes out empty. Write the notes
            # ourselves and point at upstream's release page.
            {
              echo "Mirrored build of upstream [$tag](https://github.com/tailscale/tailcat/releases/tag/$tag)."
              echo
              echo "Built from upstream commit \`$sha\` with this fork's"
              echo "[\`.goreleaser.yaml\`](https://github.com/$GITHUB_REPOSITORY/blob/main/.goreleaser.yaml),"
              echo "which adds release targets upstream does not publish"
              echo "(macOS, FreeBSD, OpenBSD, Linux riscv64). The Linux and"
              echo "Windows binaries match upstream's; the rest are"
              echo "additions, not re-builds."
              echo
              echo "See the [upstream release](https://github.com/tailscale/tailcat/releases/tag/$tag)"
              echo "for the changelog."
            } > /tmp/notes.md

            # GORELEASER_CURRENT_TAG makes GoReleaser treat the tree as
            # upstream's tag, so artifact names and the embedded
            # --version match upstream instead of a snapshot hash.
            GORELEASER_CURRENT_TAG="$tag" \
              goreleaser release --clean --skip=validate \
                --release-notes=/tmp/notes.md
          done <<< "${{ steps.pending.outputs.tags }}"

  # Build and publish whatever tree a pushed v* tag points at.
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
